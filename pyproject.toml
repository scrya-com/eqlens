[project]
name = "eqlens"
version = "0.2.0"
description = "Draw a math formula as SVG or PNG, with colored symbols, a ledger that says how to read them, and hover tips."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [{ name = "John D. Pope" }]
keywords = ["math", "latex", "svg", "formula", "terminal", "imgcat"]
dependencies = ["matplotlib"]

[project.optional-dependencies]
# For --introspect, which asks Claude what the parts of a formula mean.
ai = ["anthropic"]

[project.urls]
Homepage = "https://github.com/scrya-com/eqlens"

[project.scripts]
eqlens = "eqlens.cli:main"
eqlensd = "eqlens.server:main"
# The names before 0.2, kept so old scripts still run.
mathcat = "eqlens.cli:main"
mathd = "eqlens.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
